<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor Casero | Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./../styles.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg py-3 navbar-light bg-primary-darker">
            <div class="container">
                <button aria-controls="myNavbar2" aria-expanded="false" aria-label="Toggle navigation"
                    class="navbar-toggler" data-bs-target="#myNavbar2" data-bs-toggle="collapse" type="button"> <span
                        class="navbar-toggler-icon"></span> </button>
                <div class="collapse navbar-collapse" id="myNavbar2">
                    <div class="ml-5">
                        <ul class="navbar-nav" id="menu-menu-1">
                            <li class="nav-item"> <a class="nav-link" href="../index.html">INICIO</a> </li>
                            <li class="nav-item"> <a class="nav-link" href="./menu.html">MENÚ</a> </li>
                            <li class="nav-item"> <a class="nav-link" href="./pedidos.html">PEDIDOS</a> </li>
                            <li class="nav-item"> <a class="nav-link" href="./formulario.html">FORMULARIO</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main class="container mt-5 mb-5">
        <section class="row justify-content-center">
            <div class="col-md-6">
                <h1 class="text-center mb-4 ">Contáctanos</h1>
                <p class="text-center">Escríbenos si tienes preguntas sobre nuestro menú o tus pedidos.</p>

                <div class="container my-5">
                    <div class="row justify-content-center">
                        <div class="col-md-12 col-lg-12">
                            <div class="card shadow border-0 rounded-3">
                                <div class="card-body p-4 p-sm-5">
                                    <h3 class="card-title text-center mb-4 fw-bold text-dark">Contacto</h3>

                                    <form action="#" method="post">
                                        <div class="mb-3">
                                            <label for="nombre" class="form-label fw-semibold text-muted">Nombre</label>
                                            <input type="text" class="form-control" id="nombre" name="nombre"
                                                placeholder="Tu nombre completo" required>
                                        </div>
                                        <div class="mb-3">
                                            <label for="correo" class="form-label fw-semibold text-muted">Correo
                                                electrónico</label>
                                            <input type="email" class="form-control" id="correo" name="correo"
                                                placeholder="ejemplo@correo.com" required>
                                        </div>
                                        <div class="mb-3">
                                            <label for="asunto" class="form-label fw-semibold text-muted">Asunto</label>
                                            <select class="form-select" id="asunto" name="asunto" required>
                                                <option value="" selected disabled>Selecciona una opción</option>
                                                <option value="menu">Consulta sobre el menú</option>
                                                <option value="pedido">Pedido</option>
                                                <option value="entrega">Entrega</option>
                                                <option value="otro">Otro</option>
                                            </select>
                                        </div>
                                        <div class="mb-4">
                                            <label for="mensaje"
                                                class="form-label fw-semibold text-muted">Mensaje</label>
                                            <textarea class="form-control" id="mensaje" name="mensaje" rows="4"
                                                placeholder="Escribe tu mensaje aquí..." required></textarea>
                                        </div>
                                        <div class="d-grid gap-2">
                                            <button type="button" class="btn btn-primary fw-bold py-2 shadow-sm">Enviar
                                                mensaje</button>
                                            <a href="../index.html" class="btn btn-outline-secondary py-2">Volver al
                                                inicio</a>
                                        </div>
                                    </form>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <footer class="container border-top mt-4 py-3 text-center">
        <p><strong>Sabor Casero</strong></p>
        <p><a href="mailto:contacto@saborcasero.com">contacto@saborcasero.com</a></p>
        <p>&copy; 2026 Sabor Casero. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
