<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor Casero | Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./../styles.css">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="menu.html">Menú y precios</a></li>
                <li class="nav-item"><a class="nav-link" href="pedidos.html">Pedidos</a></li>
                <li class="nav-item"><a class="btn btn-primary" href="formulario.html" aria-current="page">Contacto</a>
            </ul>
        </nav>
    </header>


    <main class="container mt-5 mb-5">
        <section class="row justify-content-center">
            <div class="col-md-6">
                <h1 class="text-center mb-4">Contáctanos</h1>
                <p>Escríbenos si tienes preguntas sobre nuestro menú o tus pedidos.</p>

                <form action="#" method="post">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required>
                    </div>

                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="correo" name="correo" required>
                    </div>

                    <div class="mb-3">
                        <label for="asunto" class="form-label">Asunto</label>
                        <select class="form-select" id="asunto" name="asunto" required>
                            <option value="">Selecciona una opción</option>
                            <option value="menu">Consulta sobre el menú</option>
                            <option value="pedido">Pedido</option>
                            <option value="entrega">Entrega</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="mensaje" class="form-label">Mensaje</label>
                        <textarea class="form-control" id="mensaje" name="mensaje" rows="4" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-secondary">Enviar mensaje</button>
                    <a href="../index.html" class="btn btn-secondary">Volver al inicio</a>
                </form>
            </div>
        </section>
    </main>

    <footer class="container border-top mt-4 py-3 text-center">
        <p><strong>Sabor Casero</strong></p>
        <p><a href="mailto:contacto@saborcasero.com">contacto@saborcasero.com</a></p>
        <p>&copy; 2026 Sabor Casero. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
